name: Build and Publish Extension

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # Triggers only on semantic version tags like v1.1.0, v2.0.1, etc.

permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish
    permissions:
      contents: write # create the GitHub release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20'
        package-manager-cache: false

    - name: Install dependencies
      run: |
        cd cloudsmith-task
        npm ci

    - name: Run tests and validate the public task contract
      run: |
        cd cloudsmith-task
        npm test
        
    - name: Install TFX CLI
      run: npm install -g tfx-cli@0.23.4
      
    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"
        
    - name: Validate version matches manifest
      env:
        TAG_VERSION: ${{ steps.version.outputs.version }}
      run: |
        MANIFEST_VERSION=$(jq -r '.version' vss-extension.json)
        TASK_VERSION=$(jq -r '[.version.Major, .version.Minor, .version.Patch] | join(".")' cloudsmith-task/task.json)
        PACKAGE_VERSION=$(jq -r '.version' cloudsmith-task/package.json)
        for version in "$MANIFEST_VERSION" "$TASK_VERSION" "$PACKAGE_VERSION"; do
          if [ "$version" != "$TAG_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION), extension manifest ($MANIFEST_VERSION), task manifest ($TASK_VERSION), and package ($PACKAGE_VERSION) must match"
            exit 1
          fi
        done
        echo "Version validation passed: $TAG_VERSION"

    - name: Verify the version 1 maintenance line
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        MAJOR=${VERSION%%.*}
        if [ "$MAJOR" -ge 2 ]; then
          git ls-remote --exit-code --heads origin refs/heads/v1 >/dev/null
          echo "The v1 maintenance branch is available for existing task users."
        fi
        
    - name: Build extension
      run: |
        echo "Building Azure DevOps extension..."
        tfx extension create --manifest-globs vss-extension.json --output-path ./dist/
        
    - name: List generated files
      run: |
        echo "Generated files:"
        ls -la dist/
        
    - name: Get VSIX filename
      id: vsix
      run: |
        VSIX_FILE=$(find dist/ -name "*.vsix" | head -n 1)
        VSIX_FILENAME=$(basename "$VSIX_FILE")
        echo "vsix_file=$VSIX_FILE" >> $GITHUB_OUTPUT
        echo "vsix_filename=$VSIX_FILENAME" >> $GITHUB_OUTPUT
        echo "VSIX file: $VSIX_FILENAME"
        
    - name: Publish to Azure DevOps Marketplace
      env:
        TFX_PUBLISHER: ${{ vars.AZURE_DEVOPS_PUBLISHER_ID }}
        TFX_TOKEN: ${{ secrets.AZURE_DEVOPS_PAT }}
      run: |
        echo "Publishing extension to Azure DevOps Marketplace..."
        tfx extension publish \
          --manifest-globs vss-extension.json \
          --publisher "$TFX_PUBLISHER" \
          --token "$TFX_TOKEN"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
      env:
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
        VSIX_FILENAME: ${{ steps.vsix.outputs.vsix_filename }}
      with:
        name: "Release v${{ env.RELEASE_VERSION }}"
        tag_name: ${{ github.ref_name }}
        generate_release_notes: true
        files: ${{ steps.vsix.outputs.vsix_file }}
        body: |
          ## 🚀 Azure DevOps Extension v${{ env.RELEASE_VERSION }}

          ### 📦 Installation

          **Recommended: Install from Azure DevOps Marketplace**

          Install directly from the marketplace: [Cloudsmith CLI Setup & Authenticate](https://marketplace.visualstudio.com/items?itemName=Cloudsmith.CloudsmithCliSetupAndAuthenticate)

          **Alternative: Manual Installation (for self-hosted Azure DevOps Server)**

          If you're using a self-hosted Azure DevOps Server, download and manually install:
          1. Download the `${{ env.VSIX_FILENAME }}` file from this release
          2. Go to **Organization Settings** → **Extensions** → **Manage Extensions**
          3. Click **"Upload new extension"** and upload the VSIX file

          ### 📋 Changes
          See the [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for detailed changes.

    - name: Summary
      env:
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
        VSIX_FILENAME: ${{ steps.vsix.outputs.vsix_filename }}
        REPOSITORY: ${{ github.repository }}
        TAG_NAME: ${{ github.ref_name }}
      run: |
        echo "## ✅ Release Complete! 🎉" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "- **Version**: v$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
        echo "- **VSIX File**: $VSIX_FILENAME" >> "$GITHUB_STEP_SUMMARY"
        echo "- **Marketplace**: Published successfully" >> "$GITHUB_STEP_SUMMARY"
        echo "- **GitHub Release**: Created with VSIX attachment" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "### 🔗 Links" >> "$GITHUB_STEP_SUMMARY"
        echo "- [Azure DevOps Marketplace](https://marketplace.visualstudio.com/items?itemName=Cloudsmith.CloudsmithCliSetupAndAuthenticate)" >> "$GITHUB_STEP_SUMMARY"
        echo "- [GitHub Release](https://github.com/$REPOSITORY/releases/tag/$TAG_NAME)" >> "$GITHUB_STEP_SUMMARY"
